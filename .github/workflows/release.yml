name: Windows Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5

      - name: Node.js installieren
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: TypeScript prüfen
        run: npm run typecheck

      - name: Tests ausführen
        run: npm test

      - name: Produktionsbuild erstellen
        env:
          NODE_ENV: production
        run: npm run build

      - name: Release-Version prüfen
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Git-Tag und package.json-Version müssen übereinstimmen."
          }

      - name: Windows-Installer ohne Entwicklerwerkzeuge bauen
        env:
          NODE_ENV: production
        run: npx electron-builder --win nsis --publish never

      - name: GitHub Release erstellen
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $installer = Get-Item "release/Albion-PvP-Tracker-Setup-$version.exe" -ErrorAction SilentlyContinue

          if (-not $installer) {
            throw "Kein Installer im release-Ordner gefunden."
          }

          if (-not (Test-Path release/latest.yml)) {
            throw "Update-Metadaten latest.yml fehlen."
          }
          $blockmap = "$($installer.FullName).blockmap"
          if (-not (Test-Path $blockmap)) {
            throw "Installer-Blockmap fehlt."
          }

          gh release create "${{ github.ref_name }}" `
            "$($installer.FullName)" `
            release/latest.yml `
            "$blockmap" `
            --title "Albion PvP Tracker ${{ github.ref_name }}" `
            --generate-notes
